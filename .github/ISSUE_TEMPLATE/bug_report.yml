name: Bug report
description: Report a reproducible problem without private page data
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension and Chrome versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include customer URLs, page content, credentials or browsing data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true

